name: Release APK

# Development lives in `dev` (see lint.yml). Publishing happens only from here:
#   - push to `releases` -> pre-release  vX.Y.Z-bN
#   - push to `master`   -> stable release vX.Y.Z-bN
#   - push a tag v*      -> release with that tag
#   - "Run workflow" in the Actions tab -> same as the branch it is run on
on:
  push:
    branches: [releases, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Align media AGP version
      run: sed -i 's/androidGradlePlugin = "9.3.2"/androidGradlePlugin = "9.4.1"/' media/gradle/libs.versions.toml
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: temurin
        cache: gradle
    - name: Restore debug keystore (optional)
      # With the secret DEBUG_KEYSTORE_BASE64 the APK is signed with the same key as your local
      # `deploy` builds, so the release APK installs over the app already on your phone.
      env:
        KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "Using the debug keystore from the secret"
        else
          echo "No DEBUG_KEYSTORE_BASE64 secret: the APK gets a fresh debug key"
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build debug APK
      run: ./gradlew assembleDebug --max-workers=2
    - name: Name the APK
      id: meta
      run: |
        VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          TAG="${GITHUB_REF_NAME}"; PRE=""
        else
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then PRE=""; else PRE="--prerelease"; fi
        fi
        cp app/build/outputs/apk/debug/app-debug.apk "Beyond-Player-${TAG}.apk"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "pre=${PRE}" >> "$GITHUB_OUTPUT"
        echo "apk=Beyond-Player-${TAG}.apk" >> "$GITHUB_OUTPUT"
    - name: Upload APK as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.apk }}
        path: ${{ steps.meta.outputs.apk }}
    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.apk }}" \
          --target "${GITHUB_SHA}" \
          --title "Beyond Player ${{ steps.meta.outputs.tag }}" \
          --generate-notes ${{ steps.meta.outputs.pre }}