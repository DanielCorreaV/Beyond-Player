name: Lint and tests

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Align media AGP version
      run: sed -i 's/androidGradlePlugin = "9.3.2"/androidGradlePlugin = "9.4.1"/' media/gradle/libs.versions.toml
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: temurin
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check formatting with spotless (informational)
      continue-on-error: true
      run: ./gradlew spotlessCheck
    - name: Test musikr with Gradle
      run: ./gradlew musikr:testDebug